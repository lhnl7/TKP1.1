name: iOS Build IPA (No Signing)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Build archive (NO signing)
      run: |
        xcodebuild \
          -project tkp.xcodeproj \
          -scheme tkp \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          -archivePath build/tkp.xcarchive \
          archive

    - name: Export IPA manually
      run: |
        mkdir -p export/Payload
        cp -R build/tkp.xcarchive/Products/Applications/*.app export/Payload/
        cd export
        zip -r tkp.ipa Payload

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: tkp
        path: export/tkp.ipa
