    - name: Build (NO signing)
      run: |
        xcodebuild \
          -project tkp.xcodeproj \
          -scheme tkp \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build \
          -derivedDataPath build

    - name: Pack IPA manually
      run: |
        APP_PATH=$(find build -type d -name "*.app" | head -n 1)
        echo "Found app at: $APP_PATH"

        mkdir -p export/Payload
        cp -R "$APP_PATH" export/Payload/
        cd export
        zip -r tkp.ipa Payload/
