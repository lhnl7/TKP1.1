name: Build IPA (No Code Sign)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.swift') }}

      - name: Set Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Build IPA (no signing)
        run: |
          xcodebuild \
            -project tkp.xcodeproj \
            -scheme tkp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            -derivedDataPath build

          mkdir -p export

          # Find the built .app
          APP_PATH=$(find build -type d -name "*.app" | head -n 1)
          echo "Found APP: $APP_PATH"

          # Package into IPA
          cd export
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r tkp.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tkp-ipa
          path: export/tkp.ipa
