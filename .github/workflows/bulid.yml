name: Build IPA (No Code Sign)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"

      - name: Build (No Code Signing)
        run: |
          xcodebuild \
            -project tkp.xcodeproj \
            -scheme tkp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            -derivedDataPath build

      - name: Create IPA
        run: |
          mkdir -p export
          APP_PATH=$(find build -type d -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          cd export
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r tkp.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tkp-ipa
          path: export/tkp.ipa
